[package]
name = "inkpad"
description = "inkpad: a UI framework for e-ink Kindles. Apps depend on this crate."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
inkpad-hal = { path = "../inkpad-hal" }
inkpad-gfx = { path = "../inkpad-gfx" }
inkpad-ui = { path = "../inkpad-ui" }
inkpad-net = { path = "../inkpad-net" }

[target.'cfg(not(all(target_os = "linux", target_arch = "arm")))'.dependencies]
inkpad-sim = { path = "../inkpad-sim" }
