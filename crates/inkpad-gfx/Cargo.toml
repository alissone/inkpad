[package]
name = "inkpad-gfx"
description = "8-bit grayscale drawing and text rendering for inkpad"
version.workspace = true
edition.workspace = true
license.workspace = true
# Bundled fonts are under the SIL Open Font License (fonts/OFL.txt).
include = ["src/**", "fonts/**", "Cargo.toml"]

[dependencies]
inkpad-hal = { path = "../inkpad-hal" }
fontdue = "0.9"
png = "0.17"
jpeg-decoder = { version = "0.3", default-features = false }
resvg = { version = "0.50", default-features = false }
