[package]
name = "library"
description = "Library for inkpad: your Kindle's books as covers, opened in KOReader or the Kindle reader"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
inkpad = { path = "../../crates/inkpad" }
miniz_oxide = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
